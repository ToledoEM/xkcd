name: pkgdown

# Lint and spelling run on every PR, release and manual run (advisory).
# The site builds and publishes to the root of the gh-pages branch
# (https://toledoem.github.io/xkcd/) on every published Release or manual run.
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Jobs grant their own permissions; nothing by default.
permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      # Advisory: lints are reported in the log but do not fail the build.
      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: false
          R_LINTR_LINTER_FILE: .github/.lintr

  spelling:
    name: Spell check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::spelling
          needs: spelling

      # Advisory: misspellings are reported in the log but do not fail the build.
      # Add accepted words to inst/WORDLIST.
      - name: Spell check
        run: |
          res <- spelling::spell_check_package()
          print(res)
        shell: Rscript {0}

  build:
    name: Build site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Non-fatal: the site still builds (with a fallback font) if the download fails.
      - name: Install xkcd font
        run: |
          mkdir -p ~/.fonts
          curl -fsSL https://toledoem.github.io/img/xkcd.ttf -o ~/.fonts/xkcd.ttf || true
          fc-cache -f ~/.fonts || true
          Rscript -e 'extrafont::font_import(pattern = "[X/x]kcd", prompt = FALSE)' || true

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Add Figure Pose Helper
        run: |
          mkdir -p docs/stickfigurehelper
          cp stickfigurehelper/index.html docs/stickfigurehelper/index.html

      # Uploads the contents of docs/, so the site lands at the gh-pages root.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish to gh-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # One commit, force-pushed: gh-pages holds only the latest build.
      - name: Push site to gh-pages
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: site for ${SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
