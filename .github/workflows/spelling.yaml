name: spelling

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions: read-all

jobs:
  spelling:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::spelling
          needs: spelling

      # Advisory: misspellings are reported in the log but do not fail the build.
      # Add accepted words to inst/WORDLIST.
      - name: Spell check
        run: |
          res <- spelling::spell_check_package()
          print(res)
        shell: Rscript {0}
